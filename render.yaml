services:
  - type: web
    name: freelancehub-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn freelancehub.wsgi:application --bind 0.0.0.0:$PORT --pythonpath ."
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false          # you'll paste the Supabase URL manually
      - key: ALLOWED_HOSTS
        sync: false          # set after deploy — your .onrender.com domain
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # set to your Vercel frontend URL
